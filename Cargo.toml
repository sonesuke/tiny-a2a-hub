[workspace]
resolver = "2"
members = [
    "crates/hub-core",
    "crates/hub-server",
    "crates/hub-cli",
    "e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yourusername/tiny-a2a-hub"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MCP
rmcp = { version = "1.2", features = ["server", "macros", "transport-io"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/time
time = { version = "0.3", features = ["serde"] }

# Workspace crates
hub-core = { path = "crates/hub-core" }

# E2E tests dev dependencies
reqwest = { version = "0.12", features = ["json"] }
